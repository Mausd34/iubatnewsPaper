{% extends "base.html" %}
{% block title %}Delete article — {{ BRAND.NAME }}{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-16 text-center">
  <div class="bg-white rounded-xl border shadow-sm p-8">
    <p class="text-5xl mb-4">🗑️</p>
    <h1 class="font-serif text-2xl font-extrabold mb-2">Delete this article?</h1>
    <p class="text-gray-600 mb-6">“<strong>{{ article.title }}</strong>” will be permanently removed, along with
      its comments and reactions. This cannot be undone.</p>
    <form method="post">
      {% csrf_token %}
      <div class="flex justify-center gap-3">
        <a href="{{ article.get_absolute_url }}"
           class="px-5 py-2.5 rounded-lg border font-semibold text-sm hover:bg-gray-50">Cancel</a>
        <button type="submit"
                class="px-5 py-2.5 rounded-lg bg-red-600 text-white font-semibold text-sm hover:bg-red-700">
          Yes, delete it
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
